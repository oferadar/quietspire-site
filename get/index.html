<script>
// Send each visitor to their own store. The Play Store URL has to carry the
// package name, which is permanent and cannot be changed once an app has been
// published, so this page exists to be the link that gets shared instead.
(function () {
  var ios = "https://apps.apple.com/app/id6799694673";
  var play = "https://play.google.com/store/apps/details?id=com.oferadar.hapax&referrer=utm_source%3Dquietspire";
  var ua = navigator.userAgent || "";
  // iPadOS 13 and later reports itself as a Mac, so a Mac with touch is an iPad.
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof document.ontouchend !== "undefined");
  var isAndroid = /Android/.test(ua);
  if (isIOS) location.replace(ios);
  else if (isAndroid) location.replace(play);
  // Anything else, a desktop browser, stays here and picks for itself.
})();
</script>
