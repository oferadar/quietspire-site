<title>Word of the Day</title>

<script>
// The word for a date is a pure function of the date, so the correct page for
// "today" can be computed in the browser with no server and no build step.
var d = new Date();
var k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
location.replace(k + ".html");
</script>
